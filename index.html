<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma page GitHub Pages</title>
  <style>
    :root { --bg:#fafaf7; --fg:#1d1d1b; --accent:#d9480f; --card:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161614; --fg:#f2f2ee; --accent:#ff8a4c; --card:#222220; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 4rem 1.25rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; }
    h1 span { color: var(--accent); }
    p.lead { font-size: 1.15rem; opacity: .8; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-top: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    button { background: var(--accent); color:#fff; border:0; border-radius: 8px; padding: .7rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #msg { margin-top: 1rem; font-weight: 600; min-height: 1.6em; }
    footer { margin-top: 3rem; font-size: .9rem; opacity: .6; }
  </style>
</head>
<body>
  <main>
    <h1>Bonjour <span>GitHub Pages</span> 👋</h1>
    <p class="lead">Cette page d'exemple est hébergée gratuitement depuis un dépôt GitHub.</p>
    <div class="card">
      <p>Un petit test d'interactivité :</p>
      <button id="btn">Dis-moi l'heure</button>
      <div id="msg"></div>
    </div>
    <footer>Modifiez <code>index.html</code>, poussez sur <code>main</code>, et le site se met à jour.</footer>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('msg').textContent =
        'Il est ' + new Date().toLocaleTimeString('fr-FR');
    });
  </script>
</body>
</html>
